# SOTE — zum Deployen.
#
# Zwei Dienste, nichts weiter: die Datenbank und der Server. Die Oberfläche
# liefert der Server mit aus, im selben Ursprung — damit der Sitzungskeks ohne
# CORS auskommt.
#
# Die Form ist an SONEs Compose-Datei angeglichen, damit beide auf demselben
# Rechner nicht zwei verschiedene Sprachen sprechen: `POSTGRES_PASSWORD` für die
# Datenbank, `SOTE_*` für den Server, die Datenbank-URL hier zusammengesetzt und
# nicht in `.env`, und `SOTE_PORT` als Host-Port.

services:
  server:
    # Ein gebautes Abbild aus der Registry, nicht ein Bau auf dem Zielrechner:
    # ein Deployment, das baut, braucht dort eine Werkzeugkette und scheitert zu
    # einem Zeitpunkt, an dem niemand hinsieht.
    #
    # **Vorgabe ist `:main`, nicht `:latest`.** `:latest` wird erst für ein
    # Nicht-Vorab-Tag veröffentlicht; solange es keines gibt, gäbe eine Vorgabe
    # darauf beim Pullen einen 404 — und das liest sich wie ein kaputtes
    # Deployment und nicht wie ein unveröffentlichtes Projekt. Dieselbe
    # Erfahrung wie in SONE (ADR-0013). Ab dem ersten Release steht hier
    # `:latest`.
    #
    # `:main` ändert sich mit jedem Push auf main. Wer das deployt, nimmt das in
    # Kauf; für einen Stand, der nicht unter einem weggeht, setzt man SOTE_IMAGE
    # auf eine Version.
    #
    # Aus dem Quellstand bauen statt ziehen:
    #   docker compose -f docker-compose.yml -f docker-compose.build.yml up -d --build
    image: ${SOTE_IMAGE:-ghcr.io/markusthiel/sote:main}
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      # Hier zusammengesetzt und nicht in `.env`: eine URL, die das Kennwort
      # enthält, wäre eine zweite Stelle, an der es steht — und die beiden
      # laufen beim ersten Ändern auseinander.
      SOTE_DATABASE_URL: postgres://sote:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}@db:5432/sote

      # Jede Einstellung, die der Server liest, steht hier namentlich.
      #
      # SONEs Lehre, und sie hat dort vierzehn Variablen betroffen: **Compose
      # gibt die Umgebung des Rechners nicht weiter.** Was in `.env` steht und
      # hier nicht genannt ist, erreicht den Container nie — der Betreiber füllt
      # etwas aus, es wirkt nicht, und nichts sagt warum. Also lieber eine Zeile
      # zu viel als eine Einstellung, die stumm ins Leere geht.
      SOTE_SESSION_DAYS: ${SOTE_SESSION_DAYS:-30}

      # Die eigene Adresse. Ohne sie: keine Einladungsmails und kein
      # Single-Sign-on (beides braucht einen Rückweg, den nur der Betreiber
      # kennt — aus der `Host`-Kopfzeile wäre er eine Angabe des Aufrufers).
      SOTE_BASE_URL: ${SOTE_BASE_URL:-}

      # Der Schlüssel für Freigabe- und Einladungslinks. Ohne ihn gibt es
      # beides nicht, und die Bildschirme sagen das.
      #   openssl rand -hex 32
      SOTE_SHARE_KEY: ${SOTE_SHARE_KEY:-}

      # Der Mailweg. Fehlt er, geht keine Mail — Einladen funktioniert
      # trotzdem, der Link steht dann in der Liste.
      SOTE_SMTP_HOST: ${SOTE_SMTP_HOST:-}
      SOTE_SMTP_PORT: ${SOTE_SMTP_PORT:-587}
      SOTE_SMTP_USER: ${SOTE_SMTP_USER:-}
      SOTE_SMTP_PASS: ${SOTE_SMTP_PASS:-}
      # Leer heißt: aus dem Port abgeleitet (465 ja, sonst STARTTLS).
      SOTE_SMTP_SECURE: ${SOTE_SMTP_SECURE:-}
      SOTE_MAIL_FROM: ${SOTE_MAIL_FROM:-}

      # Single-Sign-on über OIDC. Alle drei oder keines.
      SOTE_OIDC_ISSUER: ${SOTE_OIDC_ISSUER:-}
      SOTE_OIDC_CLIENT_ID: ${SOTE_OIDC_CLIENT_ID:-}
      SOTE_OIDC_CLIENT_SECRET: ${SOTE_OIDC_CLIENT_SECRET:-}
      # Wie der Knopf heißt. Ohne das steht dort „Single-Sign-on", was nichts
      # über den Anbieter sagt.
      SOTE_OIDC_LABEL: ${SOTE_OIDC_LABEL:-Single-Sign-on}
    ports:
      # Host-Port links, der feste Port des Containers rechts.
      #
      # 32901, im Nachbarfeld von SONEs 32900. Die erste Fassung hatte 3001
      # „weil SONE 3000 nimmt" — das ist die Vorgabe im SONE-Repo und nicht der
      # Port, auf dem SONE hier tatsächlich läuft. Eine Vorgabe, die sich an
      # einer Beispieldatei orientiert statt an der Anlage, ist eine Vorgabe,
      # die niemand benutzt.
      #
      # Gebunden wird an alle Schnittstellen, wie bei SONE — davor gehört ein
      # Reverse Proxy mit TLS, weil der Sitzungskeks sonst im Klartext reist.
      # Wer den Port nur lokal will, schreibt `127.0.0.1:32901:8080`.
      - "${SOTE_PORT:-32901}:8080"
    healthcheck:
      test: ["CMD", "node", "docker/healthcheck.mjs"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 40s

  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: sote
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: sote
      # Deterministische Collation. Sortierschlüssel sind Fractional Indices und
      # werden lexikographisch verglichen — eine sprachabhängige Collation
      # sortiert sie um und vertauscht Zeilen. Dieselbe Zeile steht aus
      # demselben Grund in SONEs Compose-Datei.
      #
      # Sie wirkt nur beim ERSTEN Start, wenn das Datenverzeichnis leer ist.
      # Eine bestehende Datenbank ändert sie nicht — dafür braucht es ein
      # Dump-and-Restore in eine neue.
      POSTGRES_INITDB_ARGS: "--locale=C --encoding=UTF8"
    volumes:
      - sote_db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sote -d sote"]
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  sote_db:
