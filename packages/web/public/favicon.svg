<!--
  SOTE — Favicon, dreibalkig.

  Eigenes Raster für kleine Größen: Punkt 13, Abstand 11, Linien 56 / 40 / 24.
  Im vierzeiligen Raster wäre die dritte Linie 14 Einheiten lang, also so breit
  wie ihr eigener Punkt, und bei 16 px ein Fleck.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <rect x="10" y="20" width="13" height="14" fill="#161615"/>
  <rect x="34" y="20" width="56" height="14" fill="#161615"/>
  <rect x="26" y="48" width="13" height="14" fill="#161615"/>
  <rect x="50" y="48" width="40" height="14" fill="#161615"/>
  <rect x="42" y="76" width="13" height="14" fill="#2f7d6f"/>
  <rect x="66" y="76" width="24" height="14" fill="#2f7d6f"/>
</svg>
